<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>JS Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, #1f2933, #020617);
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .card {
        background: rgba(15, 23, 42, 0.9);
        border-radius: 16px;
        padding: 24px 28px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.4);
        max-width: 360px;
        width: 100%;
        text-align: center;
      }

      .title {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 0.9rem;
        color: #9ca3af;
        margin-bottom: 20px;
      }

      .counter {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 8px;
        margin-bottom: 16px;
      }

      .counter-label {
        font-size: 0.9rem;
        color: #cbd5f5;
      }

      .counter-value {
        font-size: 1.4rem;
        font-weight: 700;
        color: #facc15;
      }

      .btn {
        appearance: none;
        border: none;
        outline: none;
        cursor: pointer;
        border-radius: 999px;
        padding: 10px 24px;
        font-size: 1rem;
        font-weight: 600;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #01210c;
        box-shadow: 0 12px 25px rgba(34, 197, 94, 0.45);
        transition: transform 0.08s ease-out, box-shadow 0.08s ease-out,
          filter 0.08s ease-out;
      }

      .btn:hover {
        filter: brightness(1.05);
        box-shadow: 0 16px 36px rgba(34, 197, 94, 0.55);
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(1px) scale(0.99);
        box-shadow: 0 8px 18px rgba(22, 163, 74, 0.5);
      }

      .page-loading {
        font-size: 1rem;
        color: #e5e7eb;
        text-align: center;
        width: 100%;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1 class="title">{"JS Clicker"}</h1>
        <p class="subtitle">
          Нажми на кнопку! После 1000000 кликов ты получишь флаг!
        </p>

        <div class="counter">
          <span class="counter-label">Клики:</span>
          <span id="counter-value" class="counter-value">0</span>
        </div>

        <button id="click-btn" class="btn">Клик!</button>
      </section>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        window.state = { clicks: 0 };
        const clickBtn = document.getElementById('click-btn');
        const counterValue = document.getElementById('counter-value');
        clickBtn.addEventListener('click', function() {
          window.state.clicks++;
          counterValue.textContent = window.state.clicks;
          eval(atob("aWYgKHdpbmRvdy5zdGF0ZS5jbGlja3MgPj0gMTAwMDAwMCkgewogICAgZXZhbChhdG9iKCJLR1oxYm1OMGFXOXVLQ2w3Q2lBZ0lDQmpiMjV6ZENCbWJHRm5JRDBnSnowOVVXWnJUbnBoYWtaSFlXWldWMkpvWkRKbGJWSXpXU2M3Q2lBZ0lDQmpiMjV6ZENCbWJHRm5YMlJsWTI5a1pXUWdQU0JoZEc5aUtHWnNZV2N1YzNCc2FYUW9KeWNwTG5KbGRtVnljMlVvS1M1cWIybHVLQ2NuS1NrN0NpQWdJQ0JoYkdWeWRDaG1iR0ZuWDJSbFkyOWtaV1FwT3dwOUtTZ3AiKSk7Cn0="))
        });
      });
    </script>
  </body>
</html>
